name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only: this workflow builds and tests, it never writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 24 matches rea-agents' declared range (^22.23.4 || ^24.22.1 ||
      # >=26.12.1) and the .nvmrc in the upstream REA checkout. Node 22 works
      # but emits EBADENGINE warnings below 22.23.4, which would bury real noise.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      # Recorded in the log so a future runtime mismatch is diagnosable from CI
      # output alone.
      - name: Report toolchain versions
        run: |
          node --version
          npm --version

      # `npm ci` fails if package-lock.json disagrees with package.json, which
      # keeps the committed lockfile honest on every PR.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Build must precede tests: the CLI integration tests execute dist/cli.js
      # as a subprocess, and those tests hard-fail when CI is set but dist/ is
      # missing, so this ordering is enforced rather than assumed.
      - name: Build
        run: npm run build

      # Guards the dependency itself: if the installed rea-agents tree differs
      # from the reviewed one -- a post-install script, a partial upgrade, a
      # tampered tarball -- the rest of the suite would be testing code nobody
      # approved. Placed after the build because it runs dist/cli.js.
      - name: Verify vendored dependency
        run: node dist/cli.js vendor verify node_modules/rea-agents --manifest vendor/rea-agents.manifest.json

      # Assesses the copies of a dependency that actually ship. Deliberately
      # uses recorded advisory data (vendor/advisories/) rather than the live
      # API: a security gate that depends on a network call is a gate that goes
      # green when the network does. `npm run advisories:refresh` updates the
      # recording; see docs/supply-chain.md for why this exists at all.
      - name: Assess dependency advisories
        run: |
          node dist/cli.js vendor advisories zod \
            --advisories vendor/advisories/zod.ghsa.json \
            --accept vendor/advisories/accepted.json

      # Both vitest projects: unit, plus integration against a real rea-agents
      # MCP server over stdio and a real HTTP model server.
      - name: Test
        run: npm run test:all

      # Re-runs the suite under v8 coverage. The thresholds in vitest.config.ts
      # are a ratchet set just below the current floor, so a regression fails
      # the build rather than eroding coverage unnoticed.
      - name: Coverage
        run: npm run test:coverage
