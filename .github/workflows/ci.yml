name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only: this workflow builds and tests, it never writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Node 24 matches rea-agents' declared range (^22.23.4 || ^24.22.1 ||
      # >=26.12.1) and the .nvmrc in the upstream REA checkout. Node 22 works
      # but emits EBADENGINE warnings below 22.23.4, which would bury real noise.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Recorded in the log so a future runtime mismatch is diagnosable from CI
      # output alone.
      - name: Report toolchain versions
        run: |
          node --version
          npm --version

      # `npm ci` fails if package-lock.json disagrees with package.json, which
      # keeps the committed lockfile honest on every PR.
      - name: Install dependencies
        run: npm ci

      # `check` = tsc --noEmit, then `vitest run` across both projects.
      # The integration project drives a real rea-agents MCP server over stdio
      # and self-skips only when the package is absent, which cannot happen
      # after `npm ci` because it is a devDependency.
      - name: Typecheck and test
        run: npm run check

      # The build is a separate tsconfig (src only) and can fail independently
      # of typecheck, so it gets its own step.
      - name: Build
        run: npm run build
