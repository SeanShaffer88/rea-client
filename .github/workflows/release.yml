name: Release

# Publishing is driven by the tag, not by a merge: main can be merged to freely,
# and a release happens exactly when a `v*` tag is pushed onto it.
on:
  push:
    tags: ['v*']

# Write scope lives here and only here. `ci.yml` stays read-only, so a pull
# request can never reach a token that could create or modify a release.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The complete offline kit is larger than GitHub's 2 GiB per-asset limit.
  # Never publish the app-only setup executable as if it includes the payload.
  # Remove this gate only after split distribution is implemented and tested;
  # a tag/release also requires the user's separate explicit approval.
  offline_distribution_gate:
    name: Require complete offline release distribution
    runs-on: ubuntu-latest
    steps:
      - name: Refuse incomplete Windows distribution
        run: |
          echo '::error::Publishing is disabled: the complete offline kit exceeds GitHub release asset limits. Implement and verify multipart distribution before tagging a release.'
          exit 1

  # The Windows installer is built by its own workflow so it can also be run on
  # demand, and so the POSIX release job stays the one that decides what gets
  # published.
  installer:
    name: Windows installer
    needs: offline_distribution_gate
    uses: ./.github/workflows/installer.yml

  publish:
    name: build, test, and publish
    needs: installer
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: Build
        run: npm run build

      # The tag names a version; the binary reports one. If they disagree the
      # release would ship something other than what it says it is.
      - name: Check the tag against the built CLI
        run: |
          set -eu
          built="$(node dist/cli.js --version)"
          echo "tag: $GITHUB_REF_NAME  cli: $built"
          test "v$built" = "$GITHUB_REF_NAME"

      # The tag is the last chance to catch a tree that was never actually
      # tested: tags can be pushed from any commit, not just a merged one.
      - name: Verify vendored dependency
        run: node dist/cli.js vendor verify node_modules/rea-agents --manifest vendor/rea-agents.manifest.json

      - name: Test
        run: npm run test:all

      # `files` in package.json already limits the tarball to dist/ plus the
      # README and license, so the artifact is exactly what `npm i` would give.
      - name: Pack
        run: |
          set -eu
          mkdir -p release
          npm pack --pack-destination release
          cd release
          sha256sum ./*.tgz > SHA256SUMS
          cat SHA256SUMS

      # The installer is the artifact most users actually want, so a release
      # without one is a failed release, not a smaller one.
      - name: Fetch the Windows installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rea-workspace-windows-installer
          path: installer

      # download-artifact reproduces the archive's own layout, so the setup
      # executable arrives under whatever directory it was uploaded from. It is
      # copied to a known place once, and every later step -- checksum, notes,
      # upload -- works from that copy instead of guessing where it landed.
      - name: Normalise the installer path
        run: |
          set -eu
          find installer -type f | sort
          installer_path="$(find installer -name '*-setup.exe' -print -quit)"
          test -n "$installer_path" || { echo "The installer artifact contains no setup executable." >&2; exit 1; }
          cp "$installer_path" "release/$(basename "$installer_path")"
          ( cd release && sha256sum ./*-setup.exe > SHA256SUMS-windows.txt )
          cat release/SHA256SUMS-windows.txt

      # Notes come from the changelog entry for this version, so the release
      # text and the repository cannot drift apart. A tag without an entry is a
      # mistake worth stopping for.
      - name: Extract release notes
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          python3 - "$version" > release-notes.md <<'PY'
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          lines = text.splitlines()

          start = next(
              (i for i, line in enumerate(lines) if re.match(rf"^## \[{re.escape(version)}\]", line)),
              None,
          )
          if start is None:
              raise SystemExit(
                  f"CHANGELOG.md has no '## [{version}]' section; add one before tagging."
              )
          end = next(
              (i for i in range(start + 1, len(lines)) if lines[i].startswith("## ")),
              len(lines),
          )
          body = "\n".join(lines[start + 1 : end]).strip()

          print(f"Install and build from the tarball attached to this release:\n")
          print("```sh")
          print("npm install -g ./rea-client-{0}.tgz".format(version))
          print("rea-client --version")
          print("```\n")
          print(body)
          PY

          # Named from the artifact itself so the notes cannot claim a file the
          # release does not contain.
          installer_name="$(cd release && ls ./*-setup.exe | head -1 | sed 's|^\./||')"
          installer_sha="$(sha256sum "release/$installer_name" | cut -d' ' -f1)"
          # An empty checksum here would publish a note that looks like a
          # verification and verifies nothing.
          test -n "$installer_sha" || { echo "No checksum for $installer_name." >&2; exit 1; }
          {
            echo
            echo "### Windows installer"
            echo
            echo "\`$installer_name\` (unsigned) is attached to this release, built from"
            echo "this tag by \`.github/workflows/installer.yml\`."
            echo
            echo '```'
            echo "sha256  $installer_sha"
            echo '```'
            echo
            echo "Windows SmartScreen will warn about an unknown publisher because the"
            echo "build is not code-signed; \"More info\" then \"Run anyway\" installs it."
          } >> release-notes.md
          cat release-notes.md

      # The release is created before anything is uploaded, and the upload is a
      # separate step. `gh release create <files...>` deletes the release again
      # if one of the asset uploads fails, so a single flaky 190 MB upload would
      # leave nothing behind to retry against; this way the release exists and
      # re-running the job replaces the assets.
      #
      # Deleting a tag turns its release into a draft, and a publish that died
      # half way leaves one too. `gh release view` sees drafts, so the draft flag
      # is cleared explicitly rather than left hidden.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "rea-client $GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --draft=false
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "rea-client $GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --verify-tag
          fi

      # Small assets first: if the large installer upload has to be retried, the
      # release is already useful. Each file is retried on its own so one
      # transient failure does not throw away the others.
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" -q .id)"

          # `gh release upload` streams the body itself; for the ~190 MB installer
          # a plain POST of the file through the REST API is the fallback, and it
          # is also what makes the failure message readable in an annotation.
          upload() {
            gh release upload "$GITHUB_REF_NAME" "$1" --clobber 2>&1 && return 0
            gh api --method POST \
              -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$(basename "$1")" \
              --input "$1" 2>&1
          }

          # Listed smallest first on purpose: the installer is ~190 MB, and if it
          # is the one that has to be retried the release already has the rest.
          for asset in release/*.tgz release/SHA256SUMS release/SHA256SUMS-windows.txt release/*.exe; do
            attempt=1
            uploaded=0
            while [ "$attempt" -le 3 ]; do
              if output=$(upload "$asset"); then
                echo "uploaded $asset"
                uploaded=1
                break
              fi
              echo "::warning title=Upload failed::$(printf '%s' "$output" | tr '\n' ' ' | cut -c1-600)"
              attempt=$((attempt + 1))
              sleep 15
            done
            if [ "$uploaded" -eq 0 ]; then
              echo "::error title=Upload failed::$asset could not be uploaded; the release exists and can be completed by re-running this job."
              exit 1
            fi
          done
          gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[] | "\(.name) \(.size) \(.state)"'

      - name: Summarise
        run: |
          {
            echo "### rea-client $GITHUB_REF_NAME"
            echo
            echo '```'
            cat release/SHA256SUMS
            cat release/SHA256SUMS-windows.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
